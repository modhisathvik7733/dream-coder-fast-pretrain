# Continued pretraining config for Dream-Coder low-step decoding.
# Phase A: train base weights to natively produce good output at 4 steps/block.
#
# Hardware target: 1× A100 SXM 80GB (single GPU, no DeepSpeed required).
# Memory math:
#   Model BF16:           14 GB
#   Gradients BF16:       14 GB
#   AdamW 8-bit states:  ~14 GB
#   Activations w/ckpt:  ~10-15 GB
#   Workspace:            ~5 GB
#   Total:               ~57-62 GB  (fits 80GB comfortably)

paths:
  base_model: /workspace/models/dream-coder-7b-instruct
  data_dir: /workspace/data
  output_dir: /workspace/fast_pretrain_output

training:
  learning_rate: 1.5e-6           # very low for full FT (prevents catastrophic forgetting)
  num_epochs: 1                   # ONE epoch (more = higher forgetting risk)
  per_device_batch_size: 1
  gradient_accumulation_steps: 64 # effective batch 64 on single GPU
  max_seq_length: 768             # 512 prompt + 256 generation
  warmup_ratio: 0.05
  scheduler: cosine
  weight_decay: 0.01

  # Memory optimizations (mandatory for 7B FFT)
  bf16: true
  gradient_checkpointing: true
  optimizer: adamw_bnb_8bit       # 8-bit Adam to fit optimizer states
  max_grad_norm: 1.0

  # Checkpointing (target: 150GB disk)
  # Each checkpoint is ~14GB. save_total_limit=2 = one stable + one being written.
  save_steps: 250
  save_total_limit: 2
  logging_steps: 10

distillation:
  # Standard masked-diffusion CE loss with biased mask ratio.
  # The trick: bias mask_ratio toward HIGH values so model trains predominantly
  # on hard high-mask cases (which correspond to early denoising steps).
  # No teacher model, no consistency loss — just biased data distribution + CE.
  block_size: 32                  # informational only; not used by current loss
  mask_ratio_bias: 0.3            # ratio = uniform()^bias; LOWER bias = MORE high-mask samples
                                  # 0.3 = ~80% of samples have mask_ratio in [0.5, 1.0]

data:
  # Distribution matches Dream-Coder's actual training stages.
  # Using off-distribution data would shift the model and degrade capabilities.
  ling_coder_sft_ratio: 0.70      # Stage 2 SFT — what the instruct model was last trained on
  dream_coder_rl_ratio: 0.20      # Stage 3 RL data
  stack_edu_python_ratio: 0.10    # Stage 1 base adaptation coverage

  # 50k samples × ~600 avg tokens = ~30M tokens
  # At ~2-3 forward passes/sec on single A100 80GB: ~12-20 hours of training
  total_target_samples: 50000
  shuffle_seed: 42

logging:
  wandb_enabled: false            # set true if WANDB_API_KEY is set
  wandb_project: dream-coder-fast-pretrain
  report_to: tensorboard
  output_dir: /workspace/fast_pretrain_output/logs
