# DeepSpeed ZeRO Stage 3 config for 4× A100 PCIe 40GB.
# Shards optimizer states, gradients, and parameters across all 4 GPUs.

zero_optimization:
  stage: 3
  offload_optimizer:
    device: cpu
    pin_memory: true
  offload_param:
    device: none
  overlap_comm: true
  contiguous_gradients: true
  reduce_bucket_size: 5e8
  stage3_prefetch_bucket_size: 5e8
  stage3_param_persistence_threshold: 1e6
  stage3_max_live_parameters: 1e9
  stage3_max_reuse_distance: 1e9
  stage3_gather_16bit_weights_on_model_save: true

bf16:
  enabled: true

gradient_accumulation_steps: 32
gradient_clipping: 1.0
steps_per_print: 10
train_batch_size: auto
train_micro_batch_size_per_gpu: auto
wall_clock_breakdown: false

# Optimizer offload to CPU saves ~14 GB per GPU
# Critical for fitting 7B FFT on 40GB cards
